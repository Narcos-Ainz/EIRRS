<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign In | EIRRS</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body style="justify-content:center; align-items:center;">
  
        <div class="brand-icon"><i class="fa-solid fa-home"></i></div>
  <div class="card" style="width:100%; max-width:420px; padding:32px; margin:40px auto;">
    <div style="text-align:center; margin-bottom:24px;">
      <a src="index.html">
      <div class="brand-icon" style="margin:0 auto 12px; width:48px; height:48px; font-size:1.5rem;">
        <i class="fa-solid fa-truck-medical"></i>
      </div>
        </a>
      <h2 style="font-size:1.5rem; font-weight:800;">EIRRS Command Access</h2>
      <p style="color:var(--text-muted); font-size:0.85rem;">Emergency Incident Reporting & Response System</p>
    </div>

    <div id="loginAlert" style="display:none; padding:10px; border-radius:6px; margin-bottom:16px; font-size:0.85rem;"></div>

    <form id="loginForm">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="loginEmail" class="form-control" placeholder="admin@eirrs.gov.ng" required>
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required>
      </div>

      <button type="submit" id="loginBtn" class="btn btn-primary" style="width:100%; justify-content:center; margin-top:8px;">
        Sign In to Portal
      </button>
    </form>

    <div style="text-align:center; margin-top:20px; font-size:0.85rem; color:var(--text-muted);">
      Don't have an account? <a href="register.html" style="color:var(--primary); font-weight:700;">Register as Citizen</a>
    </div>
    <div style="background:#f8fafc; border:1px solid var(--border-color); border-radius:6px; padding:12px; margin-top:16px; font-size:0.85rem; color:var(--text-muted);">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
          <strong>Default Admin Account:</strong>
          <button type="button" onclick="fillAdmin()" class="btn btn-outline btn-sm" style="padding:2px 8px; font-size:0.75rem;">Autofill</button>
        </div>
        Email: <code>admin@eirrs.gov.ng</code><br>
        Password: <code>admin123</code>
      </div>
  </div>

  <script src="/static/main.js"></script>
  <script>
    function fillAdmin() {
    document.getElementById('loginEmail').value = 'admin@eirrs.gov.ng';
    document.getElementById('loginPassword').value = 'admin123';
  }
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const alertBox = document.getElementById('loginAlert');
      const btn = document.getElementById('loginBtn');
      btn.innerText = "Authenticating...";
      btn.disabled = true;

      const payload = {
        email: document.getElementById('loginEmail').value.trim(),
        password: document.getElementById('loginPassword').value.trim()
      };

      try {
        const res = await fetch('http://localhost:5000/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await res.json();
        if (data.success) {
          localStorage.setItem('eirrs_user', JSON.stringify(data.user));
          window.location.href = 'http://localhost:5000/dashboard.html';
        } else {
          throw new Error(data.error || 'Authentication failed');
        }
      } catch (err) {
        alertBox.style.display = 'block';
        alertBox.style.background = '#fee2e2';
        alertBox.style.color = '#b91c1c';
        alertBox.style.border = '1px solid #fca5a5';
        alertBox.innerText = err.message;
        btn.innerText = "Sign In to Portal";
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
