<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Citizen Registration | EIRRS</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body style="justify-content:center; align-items:center;">
  <div class="card" style="width:100%; max-width:440px; padding:32px; margin:40px auto;">
    <div style="text-align:center; margin-bottom:24px;">
      <div class="brand-icon" style="margin:0 auto 12px; width:48px; height:48px; font-size:1.5rem;">
        <i class="fa-solid fa-user-plus"></i>
      </div>
      <h2 style="font-size:1.5rem; font-weight:800;">Citizen Registration</h2>
      <p style="color:var(--text-muted); font-size:0.85rem;">Create an emergency audit profile</p>
    </div>

    <div id="regAlert" style="display:none; padding:10px; border-radius:6px; margin-bottom:16px; font-size:0.85rem;"></div>

    <form id="regForm">
      <div class="form-group">
        <label>Full Legal Name</label>
        <input type="text" id="regName" class="form-control" placeholder="e.g. John Doe" required>
      </div>

      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="regEmail" class="form-control" placeholder="citizen@example.com" required>
      </div>

      <div class="form-group">
        <label>Emergency Contact Phone</label>
        <input type="tel" id="regPhone" class="form-control" placeholder="+234..." required>
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" id="regPassword" class="form-control" placeholder="••••••••" required>
      </div>

      <button type="submit" id="regBtn" class="btn btn-primary" style="width:100%; justify-content:center; margin-top:8px;">
        Register Account
      </button>
    </form>

    <div style="text-align:center; margin-top:20px; font-size:0.85rem; color:var(--text-muted);">
      Already registered? <a href="login.html" style="color:var(--primary); font-weight:700;">Sign In</a>
    </div>
  </div>

  <script src="../static/main.js"></script>
  <script>
    document.getElementById('regForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const alertBox = document.getElementById('regAlert');
      const btn = document.getElementById('regBtn');
      btn.innerText = "Registering...";
      btn.disabled = true;

      const payload = {
        full_name: document.getElementById('regName').value.trim(),
        email: document.getElementById('regEmail').value.trim(),
        phone_number: document.getElementById('regPhone').value.trim(),
        password: document.getElementById('regPassword').value.trim()
      };

      try {
        const res = await fetch('http://localhost:5000/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await res.json();
        if (data.success) {
          alertBox.style.display = 'block';
          alertBox.style.background = '#dcfce7';
          alertBox.style.color = '#15803d';
          alertBox.innerText = "Registration complete! Redirecting to sign in...";
          setTimeout(() => { window.location.href = 'login.html'; }, 1500);
        } else {
          throw new Error(data.error || 'Registration failed');
        }
      } catch (err) {
        alertBox.style.display = 'block';
        alertBox.style.background = '#fee2e2';
        alertBox.style.color = '#b91c1c';
        alertBox.style.border = '1px solid #fca5a5';
        alertBox.innerText = err.message;
        btn.innerText = "Register Account";
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
